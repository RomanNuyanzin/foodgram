server {
    listen 80;
    client_max_body_size 20M;

    location /foodgram/api/docs/ {
        alias /usr/share/nginx/html/foodgram/api/docs/;
        try_files $uri $uri/redoc.html;
    }

    location /foodgram/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://backend:8000/api/;
    }

    location /foodgram/admin/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/admin/;
    }

    location /foodgram/media/ {
        alias /media/;
    }

    location /foodgram/static/admin/ {
        alias /static/admin/;
    }

    location /foodgram/static/rest_framework/ {
        alias /static/rest_framework/;
    }

    location /foodgram/s/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/s/;
    }

    location /foodgram/ {
        alias /usr/share/nginx/html/foodgram/;
        index index.html;
        try_files $uri $uri/ /foodgram/index.html;
    }
}