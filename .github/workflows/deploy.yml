name: Deploy Foodgram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.production
          push: true
          tags: romannuyanzin/foodgram_backend:latest

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile.gateway
          push: true
          tags: romannuyanzin/foodgram_gateway:latest

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "cd '${{ secrets.SERVER_APP_PATH }}' && sudo docker compose -f docker-compose.production.yml pull backend gateway && sudo docker compose -f docker-compose.production.yml up -d --force-recreate backend gateway"