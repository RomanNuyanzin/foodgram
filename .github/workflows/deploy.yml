name: Deploy Foodgram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_push_to_docker_hub:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.production
          push: true
          tags: romannuyanzin/foodgram_backend:latest

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile.gateway
          push: true
          tags: romannuyanzin/foodgram_gateway:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub

    steps:
      - name: Execute remote deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_PATH }}
            sudo docker compose -f docker-compose.production.yml pull backend gateway
            sudo docker compose -f docker-compose.production.yml up -d --force-recreate backend gateway